# Настройки Redis для AniDale.
# Debian/Ubuntu: добавьте содержимое в /etc/redis/redis.conf (или подключите файл через include).
# Порт наружу не открывайте: сервер и Redis общаются на одном компьютере.

bind 127.0.0.1
protected-mode yes
port 6379

# Кэш можно потерять (он восстановится), но Redis не должен съесть всю память машины.
# volatile-lru вытесняет только ключи с TTL — а они есть у кэша, присутствия и лимитов.
maxmemory 256mb
maxmemory-policy volatile-lru

# Переживание перезапуска: AOF (последние секунды) + RDB (контрольные точки).
appendonly yes
appendfsync everysec
save 900 1
save 300 10
