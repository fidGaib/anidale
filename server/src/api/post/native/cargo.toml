
[package]
name = "file-storage"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4", "tokio_rt"] }
napi-derive = "2"
image = "0.25"
webp = { version = "0.3", features = ["img"] }
twox-hash = "2"
tokio = { version = "1", features = ["fs", "macros"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
