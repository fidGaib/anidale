type Query {
  getPosts(limit: Int!, page: Int!): [Post!]
  getPostsByUser(id: Int!, limit: Int!, page: Int!): [Post!]
}
type Mutation {
  createPost(post: CreatePost!): Post
  removePost(id: Int!): Boolean
}
input CreatePost {
  owner: Int!
  description: String
  images: [FILE]
}
type Post {
  id: Int
  description: String
  images: [PostImages]
  date: Date
  user: Owner
  likesCount: Int
  "Поставил ли лайк текущий пользователь (для гостя всегда false)"
  liked: Boolean
  commentsCount: Int
}
type Owner {
  id: Int
  avatar: String
  login: String
}
type PostImages {
  id: Int
  high: String
  medium: String
  small: String
  vertical: Boolean
  type: String
  postId: Int
  date: Date
}
