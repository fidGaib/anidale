type Query {
  "Диалоги текущего пользователя, свежие сверху"
  getConversations: [ConversationItem!]!
  "Сообщения диалога с userId порядком «новые сверху»; beforeId — подгрузка более старых"
  getMessages(userId: Int!, beforeId: Int, limit: Int!): [Message!]!
  "Закреплённые сообщения диалога с userId, которые видны пользователю (новые закрепы последними)"
  getPinnedMessages(userId: Int!): [Message!]!
  "Поиск по тексту сообщений диалога, новые сверху; beforeId — подгрузка более старых результатов"
  searchMessages(userId: Int!, query: String!, beforeId: Int, limit: Int!): [Message!]!
  "В сети ли пользователь и когда был в последний раз"
  getPresence(userId: Int!): Presence!
  "Id последнего сообщения, до которого дочитал собеседник (0 — ничего не прочитано)"
  getPeerRead(userId: Int!): Int!
}
type Mutation {
  "replyTo — id сообщения этого же диалога, на которое отвечаем"
  sendMessage(to: Int!, text: String, files: [FILE!], replyTo: Int): Message!
  "Удалить диалог у себя (по умолчанию). С forEveryone: true переписка и файлы стираются у обоих сразу. Когда у себя удалили оба, она тоже стирается окончательно"
  deleteConversation(userId: Int!, forEveryone: Boolean): Boolean!
  markRead(userId: Int!): Boolean!
  "Править можно свои сообщения; вложения не меняются"
  editMessage(id: Int!, text: String!): Message!
  "forEveryone: стереть у обоих (только своё). Иначе скрыть у себя"
  deleteMessage(id: Int!, forEveryone: Boolean): Boolean!
  "Переслать сообщение нескольким пользователям (до 10). Файлы не копируются"
  forwardMessage(id: Int!, to: [Int!]!): [Message!]!
  "Удалить несколько сообщений (до 30). С forEveryone все должны быть вашими, иначе не удаляется ничего"
  deleteMessages(ids: [Int!]!, forEveryone: Boolean): Boolean!
  "Поставить реакцию на сообщение; emoji: null убирает свою реакцию. Повторная та же реакция тоже снимает"
  reactMessage(id: Int!, emoji: String): Message!
  "Настройки диалога у себя: без звука, архив, закрепить в списке. Не переданное не меняется"
  setConversationSettings(userId: Int!, muted: Boolean, archived: Boolean, pinned: Boolean): Boolean!
  "Переслать несколько сообщений (до 30) нескольким пользователям (до 10), в порядке переписки"
  forwardMessages(ids: [Int!]!, to: [Int!]!): [Message!]!
  "Закрепить или открепить сообщение; в диалоге до 10 закреплённых, видно обоим"
  pinMessage(id: Int!, pinned: Boolean!): Boolean!
}
type Presence {
  online: Boolean!
  lastSeenAt: Date
}
type MessageReaction {
  userId: Int!
  emoji: String!
}
type ConversationItem {
  "Без звука, в архиве, закреплён вверху списка (настройки каждого участника свои)"
  muted: Boolean!
  archived: Boolean!
  pinned: Boolean!
  user: Owner!
  lastMessage: Message
  unread: Int!
}
type Message {
  id: Int!
  text: String!
  date: Date!
  senderId: Int!
  recipientId: Int!
  "Когда сообщение редактировали; null, если не редактировалось"
  editedAt: Date
  "Логин и id автора оригинала у пересланного сообщения"
  forwardedFrom: String
  forwardedFromId: Int
  "Id сообщения, на которое это ответ (даже если оригинал уже недоступен)"
  replyToId: Int
  "Краткое содержимое оригинала; null, если оригинал удалён или недоступен"
  replyTo: ReplyPreview
  attachments: [MessageAttachment!]!
  reactions: [MessageReaction!]!
}
type ReplyPreview {
  id: Int!
  senderId: Int!
  text: String!
  "Тип и имя первого вложения оригинала, если есть"
  attachmentKind: String
  attachmentName: String
}
"kind: image | audio | file. У image file и thumb — пути без расширения (.webp добавляет клиент)"
type MessageAttachment {
  id: Int!
  kind: String!
  name: String!
  size: Int!
  file: String!
  thumb: String!
}
