# Каталог аниме: релизы, серии, расписание и жанры.
# Постеры, кадры и видео лежат в открытом каталоге /storage/anime и доступны без входа.

"Релиз каталога: карточка аниме-сериала или фильма"
type AnimeRelease {
  id: Int!
  title: String!
  "Оригинальное название"
  originalTitle: String!
  description: String!
  year: Int!
  "Зима, Весна, Лето или Осень"
  season: String!
  "ТВ, ONA, OVA или Фильм"
  type: String!
  ageRating: String!
  "ongoing, completed или announced"
  status: String!
  "Путь постера в хранилище без расширения"
  poster: String!
  "Путь кадра-превью в хранилище без расширения"
  preview: String!
  "Название франшизы; пустая строка — без франшизы"
  franchise: String!
  isPublished: Boolean!
  createdAt: Date!
  updatedAt: Date!
  genres: [AnimeGenre!]!
  episodes: [AnimeEpisode!]!
  episodesCount: Int!
  "Последняя вышедшая серия"
  latestEpisode: AnimeEpisode
  "Ближайшая запланированная серия"
  nextEpisode: AnimeScheduleEntry
}

type AnimeGenre {
  id: Int!
  name: String!
  "Сколько релизов используют жанр"
  releasesCount: Int!
}

type AnimeEpisode {
  id: Int!
  releaseId: Int!
  release: AnimeRelease!
  number: Int!
  title: String!
  description: String!
  "Путь видео в хранилище; пустая строка — видео ещё не загружено"
  video: String!
  "Путь кадра в хранилище без расширения"
  preview: String!
  "Длительность вида 24:00; пустая строка — не указана"
  duration: String!
  publishedAt: Date!
}

type AnimeScheduleEntry {
  id: Int!
  releaseId: Int!
  release: AnimeRelease!
  episodeNumber: Int!
  airAt: Date!
}

type AnimeFranchise {
  name: String!
  poster: String!
  firstYear: Int!
  lastYear: Int!
  releasesCount: Int!
  episodesCount: Int!
}

"Всё для главной страницы каталога"
type AnimeHome {
  "Четыре последние вышедшие серии"
  newEpisodes: [AnimeEpisode!]!
  "Три последние серии с видео"
  videos: [AnimeEpisode!]!
  schedule: [AnimeScheduleEntry!]!
  genres: [AnimeGenre!]!
  franchises: [AnimeFranchise!]!
}

"Где вошедший пользователь остановился в сериале"
type AnimeWatchProgress {
  "Релиз, к которому относится прогресс"
  release: AnimeRelease!
  "Серия, на которой остановились"
  episode: AnimeEpisode!
  "Позиция в серии в секундах"
  position: Float!
  "Длительность серии в секундах; 0 — неизвестна"
  duration: Float!
  "Серия досмотрена до конца"
  completed: Boolean!
  updatedAt: Date!
}

"Страница каталога: релизы под фильтром и их общее количество"
type AnimeReleasePage {
  items: [AnimeRelease!]!
  total: Int!
}

"Значения фильтров, доступные в каталоге"
type AnimeFilters {
  "Годы выпуска опубликованных релизов, новые сверху"
  years: [Int!]!
  "ТВ, ONA, OVA или Фильм"
  types: [String!]!
  genres: [AnimeGenre!]!
}

extend type Query {
  "Главная каталога: новые серии, расписание за промежуток, жанры и франшизы"
  animeHome(from: Date!, to: Date!): AnimeHome!
  "Каталог: опубликованные релизы с поиском, фильтрами и сортировкой (new или title)"
  animeCatalog(filter: AnimeReleaseFilter, sort: String, limit: Int, offset: Int): AnimeReleasePage!
  "Значения фильтров, которые реально есть в каталоге"
  animeFilters: AnimeFilters!
  "Расписание выхода серий за промежуток"
  animeSchedule(from: Date!, to: Date!): [AnimeScheduleEntry!]!
  "Опубликованный релиз со всеми сериями"
  animeRelease(id: Int!): AnimeRelease
  "Последние просмотры вошедшего пользователя: по одной записи на релиз"
  animeContinueWatching(limit: Int): [AnimeWatchProgress!]!
  "Сохранённая позиция просмотра релиза; null — ещё не смотрел или не вошёл"
  animeWatchProgress(releaseId: Int!): AnimeWatchProgress
  "Все релизы для админки, включая черновики"
  adminAnimeReleases(search: String, limit: Int, offset: Int): [AnimeRelease!]!
  "Всё расписание для админки, включая прошедшие серии"
  adminAnimeSchedule(limit: Int): [AnimeScheduleEntry!]!
  adminAnimeGenres: [AnimeGenre!]!
  "Серии релиза для админки"
  adminAnimeEpisodes(releaseId: Int!): [AnimeEpisode!]!
}

input AnimeReleaseInput {
  id: Int
  title: String!
  originalTitle: String
  description: String
  year: Int!
  season: String!
  type: String!
  ageRating: String!
  status: String!
  franchise: String
  isPublished: Boolean
  poster: FILE
  preview: FILE
  genres: [String!]
}

"Фильтры каталога: все поля необязательны"
input AnimeReleaseFilter {
  "Поиск по названию и оригинальному названию"
  search: String
  genreId: Int
  year: Int
  "ТВ, ONA, OVA или Фильм"
  type: String
  "ongoing, completed или announced"
  status: String
  "Точное название франшизы"
  franchise: String
}

input AnimeEpisodeInput {
  id: Int
  releaseId: Int!
  number: Int!
  title: String
  description: String
  duration: String
  publishedAt: Date
  video: FILE
  preview: FILE
}

input AnimeScheduleInput {
  releaseId: Int!
  episodeNumber: Int!
  airAt: Date!
}

input AnimeWatchProgressInput {
  releaseId: Int!
  episodeId: Int!
  "Позиция в серии в секундах"
  position: Float!
  "Длительность серии в секундах"
  duration: Float!
}

extend type Mutation {
  "Создать или изменить релиз (нужна роль администратора)"
  saveAnimeRelease(input: AnimeReleaseInput!): AnimeRelease!
  "Удалить релиз вместе с сериями и расписанием"
  deleteAnimeRelease(id: Int!): Boolean!
  "Добавить или изменить серию; серия убирается из расписания"
  saveAnimeEpisode(input: AnimeEpisodeInput!): AnimeEpisode!
  deleteAnimeEpisode(id: Int!): Boolean!
  "Запланировать выход серии; повтор заменяет дату"
  saveAnimeSchedule(input: AnimeScheduleInput!): AnimeScheduleEntry!
  deleteAnimeSchedule(id: Int!): Boolean!
  "Сохранить, где пользователь остановился в сериале"
  saveAnimeWatchProgress(input: AnimeWatchProgressInput!): AnimeWatchProgress!
  "Удалить жанр, который не используется релизами"
  deleteAnimeGenre(id: Int!): Boolean!
}
