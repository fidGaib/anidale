type Query {
  getUser(id: Int!): User
  getUsers(limit: Int, offset: Int, search: String): [User!]!
  logout: Boolean
  refresh: RefreshUser
}
type Mutation {
  registration(user: Registration!): User
  login(user: Login!): User
  updateUser(user: UpdateUser): typeUpdateUser
  remove: Boolean
  "Переход по одноразовой ссылке из письма (24 часа)"
  verifyEmail(token: String!): Boolean!
  "Отправить письмо с подтверждением ещё раз (с лимитом)"
  resendVerificationEmail: Boolean!
  "Запросить ссылку для восстановления пароля. Ответ не раскрывает, есть ли такая почта"
  requestPasswordReset(email: String!): Boolean!
  "Задать новый пароль по одноразовой ссылке (1 час); завершает все сессии"
  resetPassword(token: String!, pass: String!, pass2: String!): Boolean!
  "Смена пароля из настроек; завершает все сессии, кроме текущей"
  changePassword(oldPass: String!, pass: String!, pass2: String!): Boolean!
}
type RefreshUser {
  id: Int!
  login: String!
  avatar: String!
  email: String!
  isActivated: Boolean!
}
type User {
  id: Int!
  email: String!
  login: String!
  avatar: String!
  status: String
  city: String
  work: String
  education: String
  about: String
  website: String
  birthDate: Date
  isActivated: Boolean!
  createdAt: Date
  accessToken: String
  refreshToken: String
  feed: Feed
  backgroundImage: String
}

type Feed {
  id: Int
  posts: [Post!]!
}
type typeUpdateUser {
  email: String
  pass: String
  login: String
  avatar: FILE
  status: String
  city: String
  work: String
  education: String
  about: String
  website: String
  birthDate: Date
  backgroundImage: String
}
input UpdateUser {
  email: String
  login: String
  avatar: FILE
  status: String
  city: String
  work: String
  education: String
  about: String
  website: String
  birthDate: Date
  backgroundImage: FILE
}
input Registration {
  email: String!
  pass: String!
  pass2: String!
}
input Login {
  email: String!
  pass: String!
}
