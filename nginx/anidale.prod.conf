# Боевой конфиг nginx для anidale (шаблон). Замените anidale.example и пути на свои.
# Что делает: HTTPS, заголовки безопасности, отдача собранного клиента, проксирование API и сокетов,
# выдача файлов только тем, кому их можно (auth_request к серверу приложения), лимиты запросов.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;
    # Видео до 100 МБ и вложения: потолок запроса совпадает с серверным
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Лимиты запросов по адресу (общий поток и тяжёлые мутации). Тонкие лимиты по действиям — на сервере приложения.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=files:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # http → https
    server {
        listen 80;
        server_name anidale.example;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name anidale.example;

        ssl_certificate     /etc/letsencrypt/live/anidale.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anidale.example/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Заголовки безопасности для всех ответов
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        # Скрипты и стили только свои; картинки, видео и аудио — свои и data:/blob: (превью до загрузки)
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://anidale.example; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        limit_conn perip 40;

        # Собранный клиент (client/dist). Любой неизвестный адрес отдаёт index.html — маршрутизация на клиенте.
        root /var/www/anidale/client/dist;
        location / {
            try_files $uri /index.html;
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /icons/ {
            alias /var/www/anidale/client/public/icons/;
            expires 7d;
        }

        # GraphQL и сокеты
        location /graphql {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Файлы: nginx отдаёт с диска, но сначала сервер приложения решает, можно ли этому человеку
        location = /_storage_auth {
            internal;
            proxy_pass http://127.0.0.1:5000/_storage-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
        location /storage/ {
            limit_req zone=files burst=200 nodelay;
            auth_request /_storage_auth;
            alias /var/www/anidale/server/storage/;
            autoindex off;
            try_files $uri =404;
            # Доступ зависит от человека: общие кэши файл хранить не должны
            add_header Cache-Control "private, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Порт 5000 должен быть закрыт от внешней сети (файрвол); служебный адрес наружу не отдаём
        location /_storage-auth {
            return 404;
        }
    }
}
