# Конфиг nginx для anidale (локальная проверка «как на проде»).
# Пути через виртуальный диск X: (subst X: C:\Users\FID\Desktop\проекты), чтобы nginx не работал с кириллицей.
# Запуск (cmd): cd /d X:\nginx-1.30.6 && nginx.exe -p X:/nginx-1.30.6/ -c X:/anidale/nginx/anidale.conf
# Остановка: nginx.exe -p X:/nginx-1.30.6/ -c X:/anidale/nginx/anidale.conf -s quit
# Виртуальный диск снимается командой: subst X: /D
#
# Перед первым запуском соберите клиент так, чтобы он ходил на тот же origin:
#   cd client && set VITE_API_URL=http://localhost && npm run build

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       X:/nginx-1.30.6/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # Сообщения с вложениями: до 100 МБ на сообщение (см. MAX_TOTAL_SIZE на сервере и клиенте) плюс запас на текст
    client_max_body_size 110m;

    # WebSocket для Socket.IO: передаём Upgrade только когда клиент его просит
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        root   X:/anidale/client/dist;
        index  index.html;

        # $uri/index.html вместо $uri/: иначе реальная папка dist/anime перехватывает роут /anime и даёт 403
        location / {
            try_files $uri $uri/index.html /index.html;
        }

        # Хэшированные бандлы меняются только вместе с именем файла — кэшируем надолго
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /icons/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Проверка живости для мониторинга
        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:5000;
        }

        # GraphQL: запросы, подписки и загрузки файлов
        location /graphql {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO: обязателен Upgrade для WebSocket
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
        }

        # Файлы отдаёт nginx, но решает, кому можно, сервер приложения (/_storage-auth):
        # он смотрит куку входа и права на запись, сообщение или сообщество, к которым относится файл.
        location = /_storage_auth {
            internal;
            proxy_pass http://127.0.0.1:5000/_storage-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location /storage/ {
            auth_request /_storage_auth;
            alias X:/anidale/server/storage/;
            autoindex off;
            try_files $uri =404;
            # Доступ зависит от человека, поэтому общие кэши файл хранить не должны
            add_header Cache-Control "private, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
