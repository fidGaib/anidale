# Конфиг nginx для anidale.
# Пути через виртуальный диск X: (subst X: на папку проектов), чтобы nginx не работал с кириллицей.
# Запуск (cmd): cd /d X:\nginx-1.30.6 && nginx.exe -p X:/nginx-1.30.6/ -c X:/anidale/nginx/anidale.conf
# Остановка: nginx.exe -p X:/nginx-1.30.6/ -c X:/anidale/nginx/anidale.conf -s quit
# Виртуальный диск снимается командой: subst X: /D

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       X:/nginx-1.30.6/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # Сообщения с вложениями: до 100 МБ на сообщение (см. MAX_TOTAL_SIZE на сервере и клиенте) плюс запас на текст
    client_max_body_size 110m;

    # WebSocket для Socket.IO: передаём Upgrade только когда клиент его просит
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        location /storage/ {
            alias X:/anidale/server/storage/;
            autoindex off;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /icons/ {
            alias X:/anidale/client/public/icons/;
            autoindex off;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /public/ {
            alias X:/anidale/client/public/;
            autoindex off;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /assets/ {
            alias X:/anidale/client/src/assets/;
            autoindex off;
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
